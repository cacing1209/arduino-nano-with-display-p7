; PlatformIO Project Configuration File
;
; Project: ESP32 HUB75 P5 32x64 countdown timer + DFPlayer + web config
; Branch nano_p7 menyimpan versi lama (Arduino Nano + HUB08 monochrome).
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; UI settings disimpan di LittleFS (folder data/), upload pakai: pio run -t uploadfs
board_build.filesystem = littlefs

build_flags =
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/Adafruit BusIO@^1.17.0
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	esp32async/ESPAsyncWebServer@^3.12.0
	esp32async/AsyncTCP@^3.5.0
	bblanchon/ArduinoJson@^7.2.0
